app = "competitive-intel-agent"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "data"
  destination = "/app/data"
  initial_size = "1gb"

[env]
  DB_PATH = "/app/data/reports.db"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
